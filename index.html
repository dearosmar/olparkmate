<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OlparkMate — Olympic Park concert companion (demo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--navy:#1F3A68;--orange:#F28C1B;--ink:#1B2433;--sub:#6B7689;--bg:#F4F6FA;--line:#E6EAF0;
    --ok-bg:#E3F6EA;--ok:#1E8E4E;--busy-bg:#FFF1E0;--busy:#C96A00;--full-bg:#FDE6E6;--full:#C62F2F;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:"Noto Sans KR","Noto Sans SC","Noto Sans JP",system-ui,sans-serif;color:var(--ink);background:#DDE3EC;
    display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased}
  body.lang-zh{font-family:"Noto Sans SC","Noto Sans KR",system-ui,sans-serif}
  body.lang-ja{font-family:"Noto Sans JP","Noto Sans KR",system-ui,sans-serif}
  .phone{width:390px;height:844px;background:var(--bg);border-radius:36px;overflow:hidden;display:flex;flex-direction:column;
    box-shadow:0 30px 80px rgba(31,58,104,.25);position:relative}
  @media (max-width:500px){body{background:var(--bg);align-items:stretch}.phone{width:100%;height:100dvh;border-radius:0;box-shadow:none}}
  main{flex:1;overflow-y:auto;padding:38px 22px 20px;display:flex;flex-direction:column;gap:14px}
  h1{font-size:26px;font-weight:900;color:var(--navy);letter-spacing:-.3px}
  h2{font-size:17px;font-weight:700}
  .sub{font-size:13px;color:var(--sub)}
  .cap{font-size:11px;color:#8A94A6;line-height:1.45}
  .row{display:flex;align-items:center;gap:8px}
  .between{justify-content:space-between}
  .card{background:#fff;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{border:1px solid #D6DCE6;background:#fff;color:var(--sub);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;font-weight:500;cursor:pointer}
  .chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
  .pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;white-space:nowrap}
  .pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
  .pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.busy{background:var(--busy-bg);color:var(--busy)}.pill.full{background:var(--full-bg);color:var(--full)}
  .alert{background:#FFF4E6}
  .alert .k{font-size:11px;font-weight:700;color:var(--busy)}
  .alert p{font-size:14px;font-weight:500;line-height:1.5}
  .ev{display:flex;flex-direction:row;gap:14px;align-items:center;padding:12px;cursor:pointer;box-shadow:0 4px 14px rgba(31,51,89,.08);border:0;text-align:left;font:inherit;width:100%}
  .ev:active{transform:scale(.99)}
  .date{width:56px;height:64px;border-radius:12px;background:var(--navy);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
  .date small{font-size:11px;color:#AFC3E6;font-weight:500}.date b{font-size:22px;line-height:1.1}
  .ev .t{font-size:15px;font-weight:700}.ev .v{font-size:12px;font-weight:500;color:var(--orange)}.ev .m{font-size:12px;color:var(--sub)}
  .ev .info{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
  .chart{display:flex;justify-content:space-between;align-items:flex-end;height:140px}
  .bar{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--sub)}
  .bar i{display:block;width:22px;border-radius:6px}
  .best{background:var(--navy);color:#fff;gap:4px}
  .best small{font-size:11px;font-weight:700;color:#AFC3E6}.best b{font-size:30px;font-weight:900}.best p{font-size:13px;color:#DCE5F5;line-height:1.5}
  .btn{border:0;border-radius:14px;padding:14px;font:inherit;font-size:15px;font-weight:700;cursor:pointer;background:var(--orange);color:#fff;width:100%}
  .btn.line{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
  .btn.done{background:var(--ok)}.btn.line.done{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
  .li{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .li .n{font-size:14px;font-weight:500}.li .d{font-size:12px;color:var(--sub)}
  .live{background:var(--full-bg);color:var(--full)}
  .live::before{animation:blink 1.2s infinite}
  @keyframes blink{50%{opacity:.2}}
  .search{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #D6DCE6;border-radius:14px;padding:12px 14px}
  .search input{border:0;outline:0;font:inherit;font-size:15px;flex:1;min-width:0;background:transparent}
  .item{cursor:pointer;border-radius:10px;padding:6px;margin:-6px}
  .item.sel{background:#F0F4FA}
  .tag{background:#E8EEF7;color:var(--navy);font-size:11px;font-weight:700;border-radius:6px;padding:3px 8px;white-space:nowrap}
  .ko{border:2px solid var(--navy)}
  .ko .k{font-size:11px;font-weight:700;color:var(--orange)}
  .ko .big{font-family:"Noto Sans KR",sans-serif;font-size:19px;font-weight:700;line-height:1.5}
  .ko .ref{font-family:"Noto Sans KR",sans-serif;font-size:14px;font-weight:500;color:var(--navy)}
  .ko .tr{font-size:12px;color:var(--sub);line-height:1.45}
  nav{display:flex;justify-content:space-around;background:#fff;border-top:1px solid var(--line);padding:10px 8px calc(14px + env(safe-area-inset-bottom))}
  nav button{border:0;background:none;font:inherit;font-size:11px;font-weight:500;color:#A3ADBD;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;width:80px}
  nav button.on{color:var(--navy);font-weight:700}
  nav svg,.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
  .ic.s{width:18px;height:18px}
  .back{border:0;background:none;cursor:pointer;color:var(--ink);display:flex}
  .demo{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:rgba(31,58,104,.9);color:#fff;font-size:10px;padding:3px 10px;border-radius:999px;font-weight:500;white-space:nowrap;z-index:2}
  .toast{position:absolute;bottom:100px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13px;padding:8px 14px;border-radius:999px;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}
  .toast.show{opacity:1}
</style>
</head>
<body>
<div class="phone">
  <div class="demo" id="demo"></div>
  <main id="main"></main>
  <nav id="nav"></nav>
  <div class="toast" id="toast"></div>
</div>

const LOCALE = {en:'en-US',zh:'zh-CN',ja:'ja-JP',ko:'ko-KR'};

/* ───────────── State & helpers ───────────── */
const S = {lang:'en', tab:0, ev:'e1', q:'', sel:'L0421', reminded:{}, notified:false};
const $ = id => document.getElementById(id);
const t = () => I[S.lang];
const fmt = (iso, o) => new Intl.DateTimeFormat(LOCALE[S.lang], o).format(new Date(iso+'T12:00:00'));
const lvl = v => v < 50 ? 'ok' : v < 80 ? 'busy' : 'full';
const COLOR = {ok:'#3FB871', busy:'#F28C1B', full:'#E04848'};
const remindAt = b => { const [h,m] = b.split(' – ')[0].split(':').map(Number); const d = h*60+m-30; return `${String(Math.floor(d/60)).padStart(2,'0')}:${String(d%60).padStart(2,'0')}`; };
const ICON = {
  cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  chart:'<path d="M5 20V11M11 20V5M17 20v-7M3 20h18"/>',
  live:'<circle cx="12" cy="12" r="3"/><path d="M6.3 6.3a8 8 0 0 0 0 11.4M17.7 6.3a8 8 0 0 1 0 11.4"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',
  car:'<path d="M4 16V12l2-5h12l2 5v4zM4 16v3M20 16v3M7.5 13h.01M16.5 13h.01"/>',
  train:'<rect x="5" y="3" width="14" height="14" rx="3"/><path d="M5 10h14M8.5 21l2-4M15.5 21l-2-4"/>',
  exit:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',
  bell:'<path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8M10 20a2 2 0 0 0 4 0"/>',
  rain:'<path d="M17 15a4 4 0 0 0-1-7.9A6 6 0 0 0 4.5 9 3.5 3.5 0 0 0 6 15zM8 19l-1 2M12 19l-1 2M16 19l-1 2"/>',
  back:'<path d="m15 18-6-6 6-6"/>', chev:'<path d="m9 18 6-6-6-6"/>',
};
const ic = (k, cls='') => `<svg class="ic ${cls}" viewBox="0 0 24 24">${ICON[k]}</svg>`;
const pill = l => `<span class="pill ${l}">${t().lv[l]}</span>`;
function toast(msg){ const el=$('toast'); el.textContent=msg; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),1600); }

/* ───────────── Screens ───────────── */
const langChips = () => `<div class="chips">${[['en','EN'],['zh','中文'],['ja','日本語'],['ko','한국어']]
  .map(([k,l])=>`<button class="chip ${S.lang===k?'on':''}" data-lang="${k}">${l}</button>`).join('')}</div>`;

function events(){
  const L=t(), e0=DATA.events[0], f0=DATA.forecast[e0.id];
  return `<div><h1>OlparkMate</h1><p class="sub">${L.tag}</p></div>${langChips()}
  <div class="card alert"><div class="row" style="color:var(--orange)">${ic('bell','s')}<span class="k">${L.tomorrow} · ${e0.title}</span></div>
    <p>${L.alert(L.venue[e0.venue], f0.best.replace(' – ','–'))}</p></div>
  <div class="row between"><h2>${L.upcoming}</h2><span class="sub" style="color:var(--orange);font-weight:500">${L.all}</span></div>
  ${DATA.events.map(e=>`<button class="card ev" data-ev="${e.id}">
     <div class="date"><small>${fmt(e.date,{weekday:'short'}).toUpperCase()}</small><b>${+e.date.slice(8)}</b><small>${fmt(e.date,{month:'short'}).toUpperCase()}</small></div>
     <div class="info"><span class="t">${e.title}</span><span class="v">${L.venue[e.venue]}</span><span class="m">${e.time} · ${L.type[e.type]}</span></div>
     <span style="color:#A3ADBD">${ic('chev','s')}</span></button>`).join('')}
  <p class="cap">${L.evNote}</p>`;
}

function forecast(){
  const L=t(), e=DATA.events.find(x=>x.id===S.ev), f=DATA.forecast[e.id], at=remindAt(f.best), on=S.reminded[e.id];
  return `<div class="row"><button class="back" data-tab="0">${ic('back')}</button><h2>${e.title}</h2></div>
  <div class="card" style="gap:8px"><div class="chips"><span class="chip on">${L.venue[e.venue]}</span><span class="chip">${fmt(e.date,{month:'short',day:'numeric',weekday:'short'})} · ${e.time}</span></div>
    <div class="row sub" style="font-weight:500"><span style="color:#3D7BD9">${ic('rain','s')}</span>${L.weather(f.rain,f.temp)}</div></div>
  <div class="card" style="gap:12px"><h2 style="font-size:15px">${L.crowd}</h2>
    <div class="chart">${f.hours.map(([h,v])=>`<div class="bar"><i style="height:${Math.round(v*1.2)}px;background:${COLOR[lvl(v)]}"></i>${h}</div>`).join('')}</div>
    <div class="row" style="gap:6px">${pill('ok')}${pill('busy')}${pill('full')}</div></div>
  <div class="card best"><small>${L.bestK}</small><b>${f.best}</b><p>${L.bestP}</p></div>
  <button class="btn ${on?'done':''}" data-remind="${e.id}">${on?L.reminded(at):L.remind(at)}</button>
  <div class="chips">${DATA.events.map(x=>`<button class="chip ${x.id===S.ev?'on':''}" data-pick="${x.id}">${fmt(x.date,{month:'numeric',day:'numeric'})} ${x.title.split(' ')[0]}</button>`).join('')}</div>
  <p class="cap">${L.fcNote}</p>`;
}

function live(){
  const L=t(), e=DATA.events.find(x=>x.id===S.ev);
  return `<div class="row between"><h1 style="font-size:24px">${L.liveNow}</h1><span class="pill live">LIVE</span></div>
  <p class="sub" style="margin-top:-8px">${e.title} · ${L.updated}</p>
  <div class="card" style="gap:12px"><div class="row" style="color:var(--navy)">${ic('car','s')}<h2 style="font-size:15px;color:var(--ink)">${L.parking}</h2></div>
    ${DATA.parking.map(p=>`<div class="li"><div><div class="n">${L.gate[p.gate]}</div><div class="d">${L.cars(p.cars)}</div></div>${pill(p.level)}</div>`).join('')}</div>
  <div class="card" style="gap:12px"><div class="row" style="color:var(--navy)">${ic('train','s')}<h2 style="font-size:15px;color:var(--ink)">${L.subway}</h2></div>
    ${DATA.subway.map(s=>`<div class="li"><span class="n" style="font-size:13px">${L.stn[s.stn]}</span><b style="font-size:13px;color:var(--navy);white-space:nowrap">${L.min(s.next)}</b></div>`).join('')}</div>
  <div class="card" style="gap:12px"><div class="row" style="color:var(--navy)">${ic('exit','s')}<h2 style="font-size:15px;color:var(--ink)">${L.after(e.end)}</h2></div>
    <div class="li"><span class="n">${L.leave(e.end)}</span>${pill('full')}</div>
    <div class="li"><span class="n">${L.leave(addMin(e.end,30))}</span>${pill('ok')}</div>
    <p class="d" style="font-size:12px;color:var(--sub)">${L.wait}</p></div>
  <button class="btn line ${S.notified?'done':''}" data-notify>${S.notified?L.notified:L.notify}</button>`;
}
function addMin(hm,n){const [h,m]=hm.split(':').map(Number);const d=h*60+m+n;return `${String(Math.floor(d/60)%24).padStart(2,'0')}:${String(d%60).padStart(2,'0')}`;}

function lost(){
  const L=t(), q=S.q.trim().toLowerCase();
  const list = DATA.lost.filter(x=>!q || Object.values(I).some(l=>l.item[x.item].toLowerCase().includes(q)) || KO_ITEM[x.item][0].includes(q));
  if(!list.find(x=>x.id===S.sel) && list[0]) S.sel=list[0].id;
  const sel = DATA.lost.find(x=>x.id===S.sel);
  const [koName,josa] = KO_ITEM[sel.item];
  const d = {m:+sel.date.slice(5,7), day:+sel.date.slice(8)};
  return `<div><h1 style="font-size:24px">${L.lostT}</h1><p class="sub">${L.lostSub}</p></div>
  <label class="search"><span style="color:var(--sub)">${ic('search','s')}</span><input id="q" value="${S.q}" placeholder="${L.ph}" autocomplete="off"></label>
  <div class="card" style="gap:12px"><span class="sub" style="font-size:12px;font-weight:500">${L.found(list.length)}</span>
    ${list.map(x=>`<div class="li item ${x.id===S.sel?'sel':''}" data-sel="${x.id}"><div style="min-width:0"><div class="n" style="font-weight:700">${L.item[x.item]}</div>
      <div class="d">${L.foundOn(fmt(x.date,{month:'short',day:'numeric'}))} · ${L.venue[x.place]} · #${x.id.slice(1)}</div></div><span class="tag">${L.storage}</span></div>`).join('')}</div>
  <div class="card ko" style="gap:8px"><span class="k">${L.staff}${S.lang==='ko'?'':' · 직원에게 보여주세요'}</span>
    <p class="big">올림픽공원에서 ${koName}${josa} 잃어버렸어요.<br>유실물 보관 내역을 확인하고 싶어요.</p>
    <p class="ref">#${sel.id.slice(1)} · ${d.m}월 ${d.day}일 습득 · ${KO_PLACE[sel.place]}</p>
    ${S.lang==='ko'?'':`<p class="tr">${L.tr(L.item[sel.item].replace(/[（(].*$/,'').trim())}</p>`}</div>
  <button class="btn" data-dir>${L.dir}</button>`;
}

/* ───────────── Render & events ───────────── */
const SCREENS=[events,forecast,live,lost], TABICON=['cal','chart','live','search'];
function render(keepFocus){
  document.documentElement.lang = S.lang; document.body.className = 'lang-'+S.lang;
  $('demo').textContent = t().demo;
  $('main').innerHTML = SCREENS[S.tab]();
  $('nav').innerHTML = t().tabs.map((l,i)=>`<button class="${S.tab===i?'on':''}" data-tab="${i}"><svg viewBox="0 0 24 24">${ICON[TABICON[i]]}</svg>${l}</button>`).join('');
  if(keepFocus){const q=$('q'); q.focus(); q.setSelectionRange(q.value.length,q.value.length);}
}
document.addEventListener('click', e=>{
  const b = e.target.closest('[data-lang],[data-tab],[data-ev],[data-remind],[data-pick],[data-notify],[data-sel],[data-dir]'); if(!b) return;
  const d=b.dataset;
  if(d.lang){S.lang=d.lang;}
  else if(d.tab!==undefined){S.tab=+d.tab; $('main').scrollTop=0;}
  else if(d.ev){S.ev=d.ev; S.tab=1;}
  else if(d.pick){S.ev=d.pick;}
  else if(d.remind){S.reminded[d.remind]=!S.reminded[d.remind];}
  else if('notify' in d){S.notified=!S.notified;}
  else if(d.sel){S.sel=d.sel;}
  else if('dir' in d){toast(t().toast); return;}
  render();
});
document.addEventListener('input', e=>{ if(e.target.id==='q' && !e.isComposing){ S.q=e.target.value; render(true);} });
document.addEventListener('compositionend', e=>{ if(e.target.id==='q'){ S.q=e.target.value; render(true);} });
render();
</script>
</body>
</html>
